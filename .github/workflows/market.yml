name: Blizzard metadata check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check live Blizzard metadata
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          from scripts.collect import Blizzard, localized_name
          api = Blizzard()
          for rule in (1, 2, 3, 15):
              data = api.get('eu', f'/data/wow/ruleset/{rule}', optional=True)
              print('ruleset', rule, 'name:', localized_name((data or {}).get('name')) or 'missing')
          for item_id in (25, 720, 13463):
              item = api.get('eu', f'/data/wow/item/{item_id}', 'static', optional=True)
              media = api.get('eu', f'/data/wow/media/item/{item_id}', 'static', optional=True)
              icons = [a for a in (media or {}).get('assets', []) if a.get('key') == 'icon' and a.get('value', '').startswith('https://')]
              print('item', item_id, 'name:', localized_name((item or {}).get('name')) or 'missing', 'icon:', bool(icons))
          PY
