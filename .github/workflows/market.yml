name: Collect market data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: forever-market-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci
      - name: Test collector and frontend utilities
        run: npm test
      - name: Check Blizzard configuration
        id: config
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        run: |
          if [ -n "$BNET_CLIENT_ID" ] && [ -n "$BNET_CLIENT_SECRET" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Blizzard Secrets are missing. Publishing the explicitly labeled demo.'
          fi
      - name: Restore persistent market history
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          if git fetch origin market-data --depth=1; then
            git worktree add --detach "$RUNNER_TEMP/market-state" FETCH_HEAD
            if [ -d "$RUNNER_TEMP/market-state/data" ]; then
              cp -a "$RUNNER_TEMP/market-state/data/." web/data/
            fi
          else
            git worktree add --detach "$RUNNER_TEMP/market-state"
            git -C "$RUNNER_TEMP/market-state" switch --orphan market-data
          fi
      - name: Collect Blizzard data
        if: steps.config.outputs.enabled == 'true'
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          REGIONS: eu,us,kr,tw
          MAX_NAME_LOOKUPS: '300'
        run: python3 scripts/collect.py
      - name: Persist history to a separate data branch
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/market-state/data"
          cp -a web/data/. "$RUNNER_TEMP/market-state/data/"
          git -C "$RUNNER_TEMP/market-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/market-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/market-state" add data
          if ! git -C "$RUNNER_TEMP/market-state" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/market-state" commit -m 'Update auction snapshots and history'
            git -C "$RUNNER_TEMP/market-state" push origin HEAD:market-data
          fi
